<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="treeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#52b788;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d6a4f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Tree crown -->
  <circle cx="50" cy="35" r="18" fill="url(#treeGradient)"/>
  <circle cx="38" cy="42" r="15" fill="url(#treeGradient)"/>
  <circle cx="62" cy="42" r="15" fill="url(#treeGradient)"/>
  
  <!-- Tree trunk -->
  <rect x="45" y="50" width="10" height="25" rx="2" fill="#6b4423"/>
  
  <!-- Ground -->
  <ellipse cx="50" cy="75" rx="20" ry="3" fill="#95d5b2" opacity="0.5"/>
</svg>
